# :80 BEFORE the Origin CA cert exists: serve the site over plain http so the
# stack can be smoke-tested by IP. Replaced by http-redirect.conf automatically
# once /etc/nginx/tls/origin.pem and origin.key exist (restart nginx).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/imagine/drupal-locations.inc;
}
