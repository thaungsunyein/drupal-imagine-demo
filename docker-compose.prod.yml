# Production override for the Azure VM:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# nginx serves 80/443 with the Cloudflare Origin CA cert from /etc/imagine/tls on the host
# (origin.pem + origin.key, placed by hand, never in git). Without the cert nginx still
# starts and serves plain http on 80; see docker/nginx/prod/40-imagine-tls.sh.
services:
  db:
    restart: unless-stopped

  php:
    restart: unless-stopped
    configs:
      - source: php_prod_ini
        target: /usr/local/etc/php/conf.d/zz-prod.ini

  nginx:
    restart: unless-stopped
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      # Blanks out the dev server block; the prod ones are copied in by 40-imagine-tls.sh.
      - ./docker/nginx/prod/default.conf.placeholder:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/prod:/etc/nginx/imagine:ro
      - ./docker/nginx/prod/40-imagine-tls.sh:/docker-entrypoint.d/40-imagine-tls.sh:ro
      - ${TLS_DIR:-/etc/imagine/tls}:/etc/nginx/tls:ro

configs:
  php_prod_ini:
    content: |
      ; Production: code only changes on deploy, and deploy.sh restarts php-fpm.
      opcache.validate_timestamps = 0
      display_errors = Off
      log_errors = On
