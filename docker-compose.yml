# Same stack locally and on the Azure VM. Production differences live in docker-compose.prod.yml.
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-drupal}
      MARIADB_USER: ${DB_USER:-drupal}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  php:
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    # Only what Drupal needs; the DB root password is not passed in.
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-drupal}
      DB_USER: ${DB_USER:-drupal}
      DB_PASSWORD: ${DB_PASSWORD}
      HASH_SALT: ${HASH_SALT:?set HASH_SALT in .env}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-^localhost$}
    volumes:
      - ./:/var/www/html
      - files:/var/www/html/web/sites/default/files
      # Imagine content to migrate, read-only. Sample by default; full set via IMAGINE_SOURCE.
      - ${IMAGINE_SOURCE:-./source-sample}:/srv/imagine-source:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html:ro
      - files:/var/www/html/web/sites/default/files:ro
    depends_on:
      - php

volumes:
  db:
  files:
