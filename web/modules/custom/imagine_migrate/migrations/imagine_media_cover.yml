id: imagine_media_cover
label: 'Imagine: cover media'
migration_group: imagine
migration_tags:
  - imagine
source:
  plugin: imagine_asset
  kind: cover
  constants:
    alt_prefix: 'Illustration for chapter '
process:
  name: asset_id
  langcode: language
  field_media_image/target_id:
    plugin: migration_lookup
    migration: imagine_file_cover
    source: asset_id
    no_stub: true
  field_media_image/alt:
    plugin: default_value
    default_value: 'Book cover'
  status:
    plugin: default_value
    default_value: 1
  uid:
    plugin: default_value
    default_value: 1
destination:
  plugin: entity:media
  default_bundle: image
migration_dependencies:
  required:
    - imagine_file_cover
